name: Feature idea
description: Suggest something CarrierNavComms doesn't do yet
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea for a new kind of post, a nicer message, or something
        CarrierNavComms should just do differently? This is the place. No idea
        is too small.

  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      description: What would you want CarrierNavComms to do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What's it for?
      description: What's the moment at your carrier where you'd want this? Helps a lot in figuring out the right way to build it.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I checked existing issues and didn't see this one already suggested.
          required: true
